name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Free Pascal
        shell: pwsh
        run: |
          choco install -y freepascal --no-progress
          $fpc = Get-ChildItem 'C:\tools\freepascal', 'C:\ProgramData\chocolatey\lib\freepascal' -Recurse -Filter 'fpc.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $fpc) { throw "fpc.exe introuvable apres l'installation" }
          Write-Output "fpc.exe -> $($fpc.FullName)"
          Add-Content $env:GITHUB_PATH (Split-Path -Parent $fpc.FullName)
      - name: Lancer la suite de tests
        shell: cmd
        run: tests\run.bat

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Free Pascal
        run: sudo apt-get update && sudo apt-get install -y fp-compiler
      - name: Lancer la suite de tests
        run: tests/run.sh
