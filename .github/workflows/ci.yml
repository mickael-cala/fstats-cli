name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Free Pascal
        shell: pwsh
        run: |
          # choco installe le compilateur (prouve sur le runner), mais son paquet
          # lance DEUX installateurs (i386 puis win32.and.win64) dans le meme
          # repertoire : le second ecrase fpc.cfg avec des chemins incoherents,
          # d'ou 'Can't find unit Generics.Collections'. On regenere donc fpc.cfg
          # avec les chemins d'unites de l'installation i386-win32.
          $ErrorActionPreference = 'Stop'
          choco install -y freepascal --no-progress
          $base = 'C:\tools\freepascal'
          $bin = Join-Path $base 'bin\i386-win32'
          if (-not (Test-Path (Join-Path $bin 'fpc.exe'))) { throw "fpc.exe absent : $bin" }
          $cfg = @"
          # fpc.cfg regenere par la CI (le paquet choco ecrase ce fichier avec des
          # chemins incoherents apres son double installateur)
          -Fu$base/units/i386-win32/*
          -Fu$base/units/i386-win32/rtl
          -Fu$base/units/i386-win32/rtl/objpas
          -Fu$base/units/i386-win32/rtl-console
          "@
          Set-Content -Path (Join-Path $base 'fpc.cfg') -Value $cfg -Encoding Ascii
          Add-Content $env:GITHUB_PATH $bin
          Write-Output "FPC pret : $bin (fpc.cfg regenere)"
      - name: Lancer la suite de tests
        shell: cmd
        run: tests\run.bat

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Free Pascal
        run: sudo apt-get update && sudo apt-get install -y fp-compiler
      - name: Lancer la suite de tests
        run: bash tests/run.sh
