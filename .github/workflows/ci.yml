name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Free Pascal et lancer les tests
        shell: cmd
        run: |
          choco install -y freepascal --no-progress
          call "C:\ProgramData\chocolatey\bin\refreshenv.bat"
          tests\run.bat

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Free Pascal
        run: sudo apt-get update && sudo apt-get install -y fp-compiler
      - name: Lancer la suite de tests
        run: tests/run.sh
