name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Free Pascal
        run: choco install -y fpc
      - name: Lancer la suite de tests
        shell: cmd
        run: tests\run.bat

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Free Pascal
        run: sudo apt-get update && sudo apt-get install -y fp-compiler
      - name: Lancer la suite de tests
        run: tests/run.sh
