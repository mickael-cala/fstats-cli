name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Free Pascal
        shell: pwsh
        run: |
          # Installateur officiel unique (composants par defaut, dont les unites RTL).
          # choco 'freepascal' lance DEUX installateurs dans le meme repertoire,
          # ce qui ecrase fpc.cfg -> 'Can't find unit Generics.Collections'.
          $url = 'https://sourceforge.net/projects/freepascal/files/Win32/3.2.2/fpc-3.2.2.i386-win32.exe/download'
          $installer = Join-Path $env:TEMP 'fpc-3.2.2.i386-win32.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\FPC\3.2.2' -Wait
          Add-Content $env:GITHUB_PATH 'C:\FPC\3.2.2\bin\i386-win32'
      - name: Lancer la suite de tests
        shell: cmd
        run: tests\run.bat

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Free Pascal
        run: sudo apt-get update && sudo apt-get install -y fp-compiler
      - name: Lancer la suite de tests
        run: bash tests/run.sh
