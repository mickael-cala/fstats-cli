name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Free Pascal
        shell: pwsh
        run: |
          # choco installe le compilateur (prouve sur le runner), mais son paquet
          # lance DEUX installateurs (i386 puis win32.and.win64) dans le meme
          # repertoire : le second ecrase fpc.cfg avec des chemins incoherents,
          # d'ou 'Can't find unit Generics.Collections'. On regenere donc fpc.cfg
          # avec les chemins d'unites de l'installation i386-win32.
          $ErrorActionPreference = 'Stop'
          choco install -y freepascal --no-progress
          $base = 'C:\tools\freepascal'
          $bin = Join-Path $base 'bin\i386-win32'
          if (-not (Test-Path (Join-Path $bin 'fpc.exe'))) { throw "fpc.exe absent : $bin" }
          $cfg = @"
          # fpc.cfg regenere par la CI (le paquet choco ecrase ce fichier avec des
          # chemins incoherents apres son double installateur)
          -Fu$base/units/i386-win32/*
          -Fu$base/units/i386-win32/rtl
          -Fu$base/units/i386-win32/rtl/objpas
          -Fu$base/units/i386-win32/rtl-console
          "@
          Set-Content -Path (Join-Path $bin 'fpc.cfg') -Value $cfg -Encoding Ascii
          Add-Content $env:GITHUB_PATH $bin
          Write-Output "FPC pret : $bin (fpc.cfg regenere)"
          # Smoke test : trace de recherche du cfg + compilation reelle
          New-Item -ItemType Directory -Force -Path "$env:TEMP/smoke" | Out-Null
          # -Sg EXPLICITE : le matcheur wildcards v2.15.0 (fstats_lex.pas) utilise
          # GOTO/LABEL ; les fpc.cfg officiels embarquent -Sgic (donc ça compile en
          # local/dev), mais le fpc.cfg regenere ci-dessus ne porte QUE les -Fu :
          # sans -Sg explicite, la compilation echoue (vu au push v2.16.2).
          & (Join-Path $bin 'fpc.exe') -vt -Sg -O2 -Mobjfpc -FE"$env:TEMP/smoke/" "$env:GITHUB_WORKSPACE/src/fstats.pas" 2>&1 | Select-Object -Last 15
          if ($LASTEXITCODE -ne 0) { throw "compilation smoke test echouee (exit $LASTEXITCODE)" }
          # v2.13.0 : le compagnon fcmd compile aussi
          & (Join-Path $bin 'fpc.exe') -vt -Sg -O2 -Mobjfpc -FE"$env:TEMP/smoke/" "$env:GITHUB_WORKSPACE/src/fcmd.pas" 2>&1 | Select-Object -Last 15
          if ($LASTEXITCODE -ne 0) { throw "compilation smoke test fcmd echouee (exit $LASTEXITCODE)" }
      - name: Lancer la suite de tests
        shell: cmd
        run: tests\run.bat
      - name: Dogfood - checks sur le depot
        shell: cmd
        run: fstats.exe --check --fail-if non_utf8^>0 --fail-if bom^>0 --fail-if nonprintable^>0 README.md doc\*.md src\*.pas
      # v2.16.2 : le depot devenant bilingue, les miroirs EN sont aussi gates
      - name: Dogfood - miroirs anglais + exemples
        shell: cmd
        run: fstats.exe --check --fail-if non_utf8^>0 --fail-if bom^>0 --fail-if nonprintable^>0 README.en.md AGENTS.md doc\en\*.md exemples\README.md

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Free Pascal
        run: sudo apt-get update && sudo apt-get install -y fp-compiler
      - name: Lancer la suite de tests
        run: bash tests/run.sh
      - name: Dogfood - checks sur le depot
        run: src/fstats --check --fail-if non_utf8\>0 --fail-if bom\>0 --fail-if nonprintable\>0 README.md doc/*.md src/*.pas
      - name: Dogfood - miroirs anglais + exemples
        run: src/fstats --check --fail-if non_utf8\>0 --fail-if bom\>0 --fail-if nonprintable\>0 README.en.md AGENTS.md doc/en/*.md exemples/README.md
